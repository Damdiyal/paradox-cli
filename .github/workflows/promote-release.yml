name: Verify and publish product release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-product-release
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: windows-2022
            target: win-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Validate draft and download candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" | python scripts/release_snapshot.py > verified-snapshot.json
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern "paradoxcli-${RELEASE_TARGET}.*" --pattern SHA256SUMS
      - name: Verify candidate on its native platform
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/verify_release.py candidate "$RELEASE_TARGET" extracted "$RELEASE_TAG" verified-snapshot.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-${{ matrix.target }}
          path: verified-snapshot.json
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: verified-*
          path: verification
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" | python3 scripts/release_snapshot.py > current-snapshot.json
          for target in linux-x64 linux-arm64 win-x64; do
            cmp current-snapshot.json "verification/verified-$target/verified-snapshot.json"
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
